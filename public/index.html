<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyCloud Lab — 나만의 AWS 디지털 트윈</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 3 L35 11.5 V28.5 L20 37 L5 28.5 V11.5 Z' fill='%23f07b16'/%3E%3Cpath d='M20 3 L35 11.5 L20 20 L5 11.5 Z' fill='%23ffa24d'/%3E%3Cpath d='M20 20 V37 L5 28.5 V11.5 Z' fill='%23d9620a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- ---- 상단 바 ---- -->
  <header class="topbar">
    <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="메뉴 열기">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
    </button>
    <a class="brand" href="#/" aria-label="MyCloud Lab 홈">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M20 3 L35 11.5 V28.5 L20 37 L5 28.5 V11.5 Z" fill="#f07b16" />
        <path d="M20 3 L35 11.5 L20 20 L5 11.5 Z" fill="#ffa24d" />
        <path d="M20 20 V37 L5 28.5 V11.5 Z" fill="#d9620a" />
        <path d="M20 20 L35 11.5" stroke="#fff" stroke-opacity=".55" stroke-width="1.2" />
      </svg>
      <span>MyCloud Lab</span>
    </a>
    <nav class="top-links" id="top-links" aria-label="주요 메뉴">
      <a href="#/" data-top="home">아키텍처</a>
      <a href="#/guide" data-top="guide">실습</a>
      <a href="#/search" data-top="search">리소스</a>
      <a href="#/monitoring" data-top="monitoring">모니터링</a>
    </nav>
    <form class="top-search" id="top-search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg>
      <input id="search-input" type="search" placeholder="리소스, 실습, 문서 검색..." aria-label="검색" />
    </form>
    <div class="top-actions">
      <div class="dropdown" id="bell">
        <button class="icon-btn" aria-label="알림" data-dropdown="bell-panel">
          <svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z" /><path d="M10 20.5a2.2 2.2 0 0 0 4 0" /></svg>
          <span class="bell-dot" id="bell-dot" hidden></span>
        </button>
        <div class="dropdown-panel" id="bell-panel" hidden></div>
      </div>
      <div class="dropdown">
        <button class="user-btn" data-dropdown="user-panel">
          <span class="avatar">JW</span>
          <span class="user-name">종원</span>
          <svg class="chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5" /></svg>
        </button>
        <div class="dropdown-panel narrow" id="user-panel" hidden>
          <div class="dp-head"><b>조종원</b><span>계정 123456789012 · 서울 리전</span></div>
          <a href="#/guide">실습 가이드</a>
          <a href="#/cost">비용 및 예산</a>
          <button id="reset-btn" class="dp-danger">실습 환경 초기화</button>
        </div>
      </div>
    </div>
  </header>

  <div class="layout">
    <!-- ---- 좌측 메뉴 ---- -->
    <aside class="sidebar" id="sidebar">
      <nav id="side-nav" aria-label="서비스"></nav>
      <a class="learn-card" href="#/guide">
        <svg viewBox="0 0 48 32" aria-hidden="true"><path d="M2 30 L16 10 L24 20 L31 12 L46 30 Z" fill="#3b82f6" opacity=".85" /><path d="M16 10 L20 16 L12 16 Z" fill="#fff" /><circle cx="38" cy="7" r="3.5" fill="#f59e0b" /></svg>
        <div><b>직접 해보며 배우기</b><span>강의 흐름대로 8단계 실습</span></div>
        <svg class="chev-r" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></svg>
      </a>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <!-- ---- 본문 ---- -->
    <main class="main" id="main">
      <nav class="crumbs" id="crumbs" aria-label="현재 위치"></nav>
      <div id="content"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast" role="status" hidden></div>

  <script src="/js/core.js"></script>
  <script src="/js/overview.js"></script>
  <script src="/js/network.js"></script>
  <script src="/js/compute.js"></script>
  <script src="/js/traffic.js"></script>
  <script src="/js/containers.js"></script>
  <script src="/js/storage.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/security.js"></script>
  <script src="/js/monitoring.js"></script>
  <script src="/js/guide.js"></script>
  <script>App.start();</script>
</body>
</html>
